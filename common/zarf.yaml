# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: neuvector-common
  description: "UDS NeuVector Common Package"

components:
  - name: neuvector
    required: true
    charts:
      - name: crd
        url: https://neuvector.github.io/neuvector-helm/
        version: 2.11.2
        namespace: neuvector
        gitPath: charts/crd
        values:
          - sourcePath: .crd
            targetPath: .
      - name: uds-neuvector-config
        namespace: neuvector
        version: 0.1.0
        localPath: ../chart
        valuesFiles:
          - ../chart/values.yaml
        values:
          - sourcePath: .uds-neuvector-config
            targetPath: .
      - name: core
        url: https://neuvector.github.io/neuvector-helm/
        version: 2.11.2
        namespace: neuvector
        gitPath: charts/core
        valuesFiles:
          - ../values/common-values.yaml
        values:
          - sourcePath: .core
            targetPath: .
            excludePaths:
              - .core.registry
              - .core.tag
              - .core.controller.image
              - .core.enforcer.image
              - .core.manager.image
              - .core.cve.updater.image
              - .core.cve.scanner.image
              - .core.global.azure.images
              - .core.global.aws.image
              - .core.imagePullSecrets
              - .core.global.azure.imagePullSecrets
              - .core.global.aws.imagePullSecrets
              - .core.enforcer.securityContext
              - .core.controller.certupgrader.runAsUser
              - .core.manager.runAsUser
              - .core.cve.updater.runAsUser
              - .core.cve.scanner.runAsUser
              - .core.leastPrivilege
              - .core.controller.prime
              - .core.cve.adapter
