name: Lint

on:
  # This workflow is triggered on pull requests to the main branch.
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, edited, synchronize]

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@807de6f4efca9f51ee5e8d3e466d5f089c9eaab8 # v1.34.1
    secrets: inherit

  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: v0.38.0
      - name: Validate Renovate configuration
        run: uds run -f tasks/lint.yaml renovate --no-progress
