name: Lint

on:
  # This workflow is triggered on pull requests to the main branch.
  pull_request:
    branches: [main]
    # milestoned is added here so that a PR can be re-triggered if it is milestoned.
    types: [milestoned, opened, edited, synchronize]

jobs:
  run:
    uses: defenseunicorns/uds-common/.github/workflows/callable-lint.yaml@3a4908e410409ab908df7c1710ecca04c1647703 # v1.30.1
    secrets: inherit

  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: v0.38.0
      - name: Validate Renovate configuration
        run: uds run -f tasks/lint.yaml renovate --no-progress
