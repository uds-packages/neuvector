name: Auto Update
# Uses callable-auto-update from uds-common to scan the sboms in the package, grab the
# image digests, and compare to the current upstream image digests of the same tag. If
# the digests don't match in any image, then bump the uds version to trigger
# a new release.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Enable dry-run mode, which doesn't commit changes to the repository.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: 0 14 * * 1 # weekly Monday at 2 PM UTC

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: write # Allows writing content to the repository.
  packages: read # Allows reading the content of the repository's packages.
  pull-requests: write # Allows creating or updating pull requests.
  id-token: write # Required by uds-common auto-update workflow to authenticate with chainguard

# Abort prior jobs in the same workflow / PR
concurrency:
  group: auto-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-update:
    uses: defenseunicorns/uds-common/.github/workflows/callable-auto-update.yaml@86fcadc2845a318761276a8754e47e33c0d6ae31 # v1.24.10
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
    secrets: inherit # Inherits all secrets from the parent workflow.
