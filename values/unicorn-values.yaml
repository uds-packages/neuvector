# Generate certs missing from unicorn images
autoGenerateCert: true

registry: cgr.dev
# renovate: datasource=docker depName=cgr.dev/defenseunicorns.com/neuvector-controller-fips versioning=docker
tag: "v5.6.0"

manager:
  image:
    repository: defenseunicorns.com/neuvector-manager

enforcer:
  image:
    repository: defenseunicorns.com/neuvector-enforcer-fips

controller:
  image:
    repository: defenseunicorns.com/neuvector-controller-fips

cve:
  scanner:
    podLabels:
      uds/fsgroup: "1000"
    image:
      registry: cgr.dev
      repository: defenseunicorns.com/neuvector-scanner-fips
      tag: "v4"
    volumes:
      - name: internal-cert-dir
        emptyDir:
          sizeLimit: 50Mi
      # CGR image runs as non-root and cannot write to /tmp; emptyDirs provide writable scratch space.
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - mountPath: /etc/neuvector/certs/internal/
        name: internal-cert-dir
      - mountPath: /tmp
        name: tmp
  updater:
    enabled: true
    image:
      repository: defenseunicorns.com/curl-fips
      # renovate: datasource=docker depName=cgr.dev/defenseunicorns.com/curl-fips versioning=docker
      tag: "v8.21.0-dev"
